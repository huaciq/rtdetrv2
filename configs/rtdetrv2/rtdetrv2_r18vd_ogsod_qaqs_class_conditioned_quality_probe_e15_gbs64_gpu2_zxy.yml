__include__:
  - './rtdetrv2_r18vd_80e_ogsod_qaqs_gbs64_gpu2_zxy.yml'

# Frozen original QAQS detector + one final-layer [query, class] quality probe.
# Initialize detector weights with --tuning from the original QAQS best.pth.
output_dir: /home/zxy/sar/experiments/ogsod_rtdetrv2_r18_qaqs_class_conditioned_quality_probe_e15_gbs64_gpu2_zxy
epoches: 15
checkpoint_freq: 1
checkpoint_metric: class_conditioned_quality_correlation
use_ema: False

PResNet:
  pretrained: False

RTDETR:
  freeze_detector_for_final_quality_probe: True

RTDETRTransformerv2:
  class_conditioned_final_quality_probe: True

RTDETRCriterionv2:
  class_conditioned_final_quality_probe: True
  class_conditioned_quality_topk: 100
  weight_dict:
    loss_class_conditioned_quality: 1.0

RTDETRPostProcessor:
  final_score_method: class_conditioned_quality
  class_conditioned_quality_beta: 0.0
  decoder_quality_iou_mode: pairwise_class

optimizer:
  type: AdamW
  params:
    -
      params: 'decoder.class_conditioned_quality_probe_head'
  lr: 0.001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

lr_scheduler:
  type: MultiStepLR
  milestones: [10]
  gamma: 0.1

lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 100
