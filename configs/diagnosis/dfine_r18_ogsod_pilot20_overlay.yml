# Input to tools/prepare_dfine_pilot.py, not a standalone RT-DETR config.
# Shared data/backbone/optimizer/augmentation come from the E0 pilot config.
# Retain upstream D-FINE FDR, GO-LSD, native encoder and localization criterion.
epochs: 20
checkpoint_freq: 5
output_dir: /data2/zxy/sar/experiments/ogsod_dfine_r18_pilot20_seed0
DFINE:
  backbone: PResNet
  encoder: HybridEncoder
  decoder: DFINETransformer
DFINETransformer:
  reg_max: 32
  reg_scale: 4
  layer_scale: 1
use_wandb: False
